<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fábrica de Ração — Granja São José</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2333;
    --border: #2a3045;
    --accent: #f5a623;
    --accent2: #e8891a;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --text: #e8eaf0;
    --text2: #8b92a8;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--bg2);
    border-bottom: 2px solid var(--accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .btn-admin {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
  }
  .btn-admin:active { opacity: 0.7; }

  /* ===== NAV TABS ===== */
  .nav-tabs {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .nav-tab {
    flex: 1;
    min-width: 100px;
    padding: 14px 10px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(245,166,35,0.05);
  }

  /* ===== MAIN CONTENT ===== */
  .content { padding: 16px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== CARDS ===== */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ===== RAÇÃO TYPE GRID ===== */
  .racao-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .racao-btn {
    background: var(--bg3);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .racao-btn:active { transform: scale(0.97); }
  .racao-btn.selected {
    border-color: var(--accent);
    background: rgba(245,166,35,0.1);
  }
  .racao-btn-icon { font-size: 28px; margin-bottom: 8px; }
  .racao-btn-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .racao-btn-premix {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* ===== FORMULA TABLE ===== */
  .formula-table {
    width: 100%;
    border-collapse: collapse;
  }
  .formula-table th {
    background: var(--bg3);
    padding: 10px 12px;
    text-align: left;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
  }
  .formula-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .formula-table tr:last-child td { border-bottom: none; }
  .formula-table .qty {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    text-align: right;
  }
  .stock-ok { color: var(--green); font-size: 12px; }
  .stock-low { color: var(--accent); font-size: 12px; }
  .stock-zero { color: var(--red); font-size: 12px; }

  /* ===== BUTTONS ===== */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 12px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-success { background: var(--green); color: #000; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-outline {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--text2);
  }
  .btn-sm {
    display: inline-block;
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    margin-top: 0;
  }
  .btn-blue { background: var(--blue); color: #fff; }

  /* ===== ESTOQUE ===== */
  .estoque-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .estoque-item:last-child { border-bottom: none; }
  .estoque-nome {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .estoque-unidade {
    font-size: 11px;
    color: var(--text2);
    margin-top: 2px;
  }
  .estoque-saldo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    text-align: right;
  }
  .saldo-ok { color: var(--green); }
  .saldo-baixo { color: var(--accent); }
  .saldo-zero { color: var(--red); }

  /* ===== BOTÕES +/- ESTOQUE ===== */
  .estoque-controles {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    justify-content: flex-end;
  }
  .btn-pm {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .btn-pm:active { background: var(--accent); color: #000; }
  .btn-pm.plus { border-color: var(--green); color: var(--green); }
  .btn-pm.plus:active { background: var(--green); color: #000; }
  .btn-pm.minus { border-color: var(--red); color: var(--red); }
  .btn-pm.minus:active { background: var(--red); color: #fff; }
  .pm-step-label {
    font-size: 11px;
    color: var(--text2);
    text-align: center;
    min-width: 30px;
  }

  /* ===== HISTORICO ===== */
  .historico-item {
    background: var(--bg3);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    border-left: 3px solid var(--accent);
  }
  .historico-tipo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
  }
  .historico-meta {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }

  /* ===== INPUTS ===== */
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  select.form-input { cursor: pointer; }

  /* ===== PREMIX SELECTOR ===== */
  .premix-selector {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .premix-opt {
    flex: 1;
    padding: 12px;
    background: var(--bg3);
    border: 2px solid var(--border);
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text2);
  }
  .premix-opt.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(245,166,35,0.1);
  }

  /* ===== CONFIRMAÇÃO ===== */
  .confirm-box {
    background: rgba(245,166,35,0.08);
    border: 2px solid var(--accent);
    border-radius: 12px;
    padding: 16px;
    margin: 16px 0;
  }
  .confirm-box-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .confirm-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .confirm-row:last-child { border-bottom: none; }

  /* ===== BADGE ===== */
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-green { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-red { background: rgba(231,76,60,0.15); color: var(--red); }
  .badge-orange { background: rgba(245,166,35,0.15); color: var(--accent); }

  /* ===== ALERTA ===== */
  .alerta {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #ff6b6b;
  }
  .alerta-title {
    font-weight: 700;
    margin-bottom: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    text-transform: uppercase;
  }

  /* ===== SEPARADOR ===== */
  .sep {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  /* ===== EDIT TABLE (ADMIN) ===== */
  .edit-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .edit-row-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
  }
  .edit-input-sm {
    width: 90px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    text-align: right;
  }
  .edit-unit {
    font-size: 12px;
    color: var(--text2);
    width: 40px;
  }

  /* ===== SCROLL ===== */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ===== TOAST ===== */
  Correção sincronização de estoque
